name: No2Theft Remote Alarm Test Build
on:
  push:
    branches: [no2theft-remote-alarm-test]
    paths:
      - 'RemoteAlarm/**'
      - '.github/workflows/remote-alarm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
      - name: Create SpringBoard filter
        working-directory: RemoteAlarm
        run: |
          python3 - <<'PY'
          import plistlib
          with open('N2TRemoteAlarm.plist','wb') as f:
              plistlib.dump({'Filter':{'Bundles':['com.apple.springboard']}},f)
          PY
      - name: Build rootless DEB
        working-directory: RemoteAlarm
        run: make clean package FINALPACKAGE=1
      - name: Validate DEB
        run: |
          ls -lh RemoteAlarm/packages/*.deb
          ar -t RemoteAlarm/packages/*.deb
      - name: Upload test DEB
        uses: actions/upload-artifact@v4
        with:
          name: No2Theft-RemoteAlarm-v1.3.3
          path: RemoteAlarm/packages/*.deb
          if-no-files-found: error
      - name: Publish test package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create no2theft-remote-alarm-v1.3.3-test RemoteAlarm/packages/*.deb --target "${{ github.sha }}" --title "No2Theft Remote Alarm Test v1.3.3" --notes "Experimental companion for No2Theft Enhanced v1.3.2. Install both packages. Preserves SMS email and attempts to trigger the original siren, flashlight and PIN prompt." --prerelease --latest=false
