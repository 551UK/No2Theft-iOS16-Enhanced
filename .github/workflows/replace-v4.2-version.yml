name: Replace v4.2 Release DEB Version
on:
  push:
    branches: [main]
    paths: ['.github/workflows/replace-v4.2-version.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repackage only the Version field
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p old unpack new
          gh release download v4.2 -p 'No2Theft-Enhanced-iOS16-v4.2.deb' --dir old --repo "$GITHUB_REPOSITORY"
          cp old/No2Theft-Enhanced-iOS16-v4.2.deb original.deb
          echo '0dadec23d6129b8520831f9ecc914cdffaeaa0cc2c87664ddb708c7f7655a408  original.deb' | sha256sum -c -
          test "$(dpkg-deb -f original.deb Version)" = '1.3.5+integrated4.2'
          dpkg-deb -R original.deb unpack
          python3 - <<'PY'
          from pathlib import Path
          p=Path('unpack/DEBIAN/control')
          control=p.read_text()
          assert control.count('Version: 1.3.5+integrated4.2\n')==1
          p.write_text(control.replace('Version: 1.3.5+integrated4.2\n','Version: 4.2\n'))
          PY
          dpkg-deb --root-owner-group -Zgzip -z9 --build unpack No2Theft-Enhanced-iOS16-v4.2.deb
          test "$(dpkg-deb -f No2Theft-Enhanced-iOS16-v4.2.deb Version)" = '4.2'
          test "$(dpkg-deb -f No2Theft-Enhanced-iOS16-v4.2.deb Package)" = 'xyz.cypwn.no2theft16'
          test "$(dpkg-deb -f No2Theft-Enhanced-iOS16-v4.2.deb Name)" = 'No2Theft Enhanced iOS16'
          dpkg-deb -x original.deb old/unpacked
          dpkg-deb -x No2Theft-Enhanced-iOS16-v4.2.deb new/unpacked
          diff -qr old/unpacked new/unpacked
          echo 'PASS: Installed file contents unchanged; Version is 4.2'
      - name: Replace the existing v4.2 asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v4.2 No2Theft-Enhanced-iOS16-v4.2.deb --clobber --repo "$GITHUB_REPOSITORY"
          mkdir -p final
          gh release download v4.2 -p 'No2Theft-Enhanced-iOS16-v4.2.deb' --dir final --repo "$GITHUB_REPOSITORY"
          cmp No2Theft-Enhanced-iOS16-v4.2.deb final/No2Theft-Enhanced-iOS16-v4.2.deb
          test "$(dpkg-deb -f final/No2Theft-Enhanced-iOS16-v4.2.deb Version)" = '4.2'
          echo 'Verified published v4.2 asset has the correct internal version'
          sha256sum No2Theft-Enhanced-iOS16-v4.2.deb
