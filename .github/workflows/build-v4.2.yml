name: Build No2Theft Enhanced iOS16 v4.2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
      - name: Install package utilities
        run: brew install dpkg
      - name: Build only working GPS and Photo Guard fixes
        shell: bash
        run: |
          for dir in SMSLocationFix PhotoCrashGuard GPSNotice; do
            (cd "$dir" && make clean package FINALPACKAGE=1)
          done
      - name: Fetch and validate original stable No2Theft v1.3.5
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/551UK/No2Theft-iOS16-Enhanced/releases/download/v1.3.5/No2Theft-Enhanced-v1.3.5.deb" -o stable.deb
          echo "e3d22e1dd8f407eb4c43a67f78b8956779c36f6f2e24d73e39d9e3609066a0ff  stable.deb" | shasum -a 256 -c
      - name: Combine one DEB with inline SMS Settings
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,plistlib,re,shutil,subprocess
          from pathlib import Path
          def run(*args): subprocess.run(args,check=True)
          root=Path('assembled')
          run('dpkg-deb','-R','stable.deb',str(root))
          for name in ('SMSLocationFix','PhotoCrashGuard','GPSNotice'):
              debs=glob.glob(name+'/packages/*.deb')
              assert len(debs)==1,(name,debs)
              stage=Path('extract-'+name)
              run('dpkg-deb','-x',debs[0],str(stage))
              for p in stage.rglob('*'):
                  if not p.is_file(): continue
                  rel=p.relative_to(stage)
                  dest=root/rel
                  assert not dest.exists(),str(dest)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,dest)
          pref=root/'var/jb/Library/PreferenceBundles/No2Theft.bundle/No2Theft3.plist'
          obj=plistlib.loads(pref.read_bytes())
          items=obj['items']
          assert items[23]['key']=='pinEnable'
          assert items[26]['key']=='emailRemote'
          assert items[29]['key']=='sendEmail'
          assert items[36]['key']=='emailPassword'
          assert not any(x.get('key') in ('sendSMS','smsRemote','firstNumber','secondNumber') for x in items)
          baseline=list(items)
          domain='com.elias.no2theft3'
          extras=[
            {'cell':'PSGroupCell','label':'SMS Settings',
             'footerText':'Original No2Theft SMS settings. Use Apply Changes after editing. Phone numbers may include +44.'},
            {'cell':'PSSwitchCell','label':'Send SMS Alerts On Alarm Trigger','key':'sendSMS','defaults':domain},
            {'cell':'PSSwitchCell','label':'Sends SMS On Remote Command','key':'smsRemote','defaults':domain},
            {'cell':'PSEditTextCell','label':'SMS Number 1','key':'firstNumber','defaults':domain,'placeholder':'+447123456789'},
            {'cell':'PSEditTextCell','label':'SMS Number 2','key':'secondNumber','defaults':domain,'placeholder':'Optional second number'}
          ]
          assert items[25].get('label')=='Remote Commands'
          idx=25
          items[idx:idx]=extras
          smtp=[row for row in items if row.get('label')=='Gmail SMTP (Test 3)']
          assert len(smtp)==1
          smtp[0]['label']='GMAIL SMTP'
          assert items[:idx]==baseline[:idx]
          assert [x.get('key') for x in items[idx+len(extras):]]==[x.get('key') for x in baseline[idx:]]
          assert items[idx+len(extras)].get('label')=='Remote Commands'
          original_keyed=[(x.get('key'),x.get('cell'),x.get('defaults'),x.get('action')) for x in items if x.get('key')]
          # Fix the stray help text above Custom Pin: attach to its actual section.
          assert items[21].get('footerText','').startswith('Assign a pin')
          assert items[22].get('label')=='Custom Pin'
          assert items[23].get('key')=='pinEnable' and items[24].get('key')=='pin'
          items[22]['footerText']='Set a PIN to disarm the alarm instead of Face ID or Touch ID.'
          del items[21]
          def group(label):
              found=[x for x in items if x.get('cell')=='PSGroupCell' and x.get('label')==label]
              assert len(found)==1,label
              return found[0]
          group('SMS Settings')['footerText']='Enter numbers with country codes (such as +44), then tap Apply Changes.'
          group('Remote Commands')['footerText']='Text your chosen phrase to trigger the alarm. PIN, SOS and email options still apply.'
          group('GMAIL SMTP')['footerText']='Use Gmail and an app password. No2Theft stores the password unencrypted. Respring after editing.'
          redundant=[i for i,x in enumerate(items) if x.get('cell')=='PSGroupCell' and not x.get('label') and x.get('footerText','').startswith('SMTP host fixed to smtp.gmail.com.')]
          assert len(redundant)==1
          del items[redundant[0]]
          group('Receiver email address')['footerText']='Enter one or two email addresses for alerts.'
          group('WiFi networks')['footerText']='Up to five trusted Wi-Fi networks. Leave blank to allow alarms on any network.'
          assert [(x.get('key'),x.get('cell'),x.get('defaults'),x.get('action')) for x in items if x.get('key')]==original_keyed
          assert [x.get('key') for x in items if x.get('key') in ('sendSMS','smsRemote','firstNumber','secondNumber')]==['sendSMS','smsRemote','firstNumber','secondNumber']
          pref.write_bytes(plistlib.dumps(obj,fmt=plistlib.FMT_XML,sort_keys=False))
          assert not (root/'var/jb/Library/PreferenceBundles/N2TSMSNumbers.bundle').exists()
          assert not list(root.rglob('N2TSMSNumbers.plist'))
          ctrl=root/'DEBIAN/control'
          txt=ctrl.read_text()
          txt,n=re.subn(r'^Version:.*$', 'Version: 1.3.5+integrated3.8',txt,count=1,flags=re.M)
          assert n==1
          txt,n=re.subn(r'^Description:.*(?:\n [^\n]*)*',
            'Description: No2Theft Enhanced experimental SMS Settings fix.\n Preserves original PIN, email, SMS sending, alarm, GPS and SOS components.\n Includes corrected SMS GPS and Photo Crash Guard; exposes original SMS settings inline without a secondary preferences bundle.',
            txt,count=1,flags=re.M)
          assert n==1
          addons=('uk.551.no2theft.smslocationfix','uk.551.no2theft.photocrashguard','uk.551.no2theft.smsnumbersprefs')
          for field in ('Conflicts','Replaces'):
              match=re.search(r'^'+field+r':\s*(.*)$',txt,re.M)
              values=[v.strip() for v in match.group(1).split(',')] if match else []
              values.extend(x for x in addons if x not in values)
              line=field+': '+', '.join(values)
              if match: txt=txt[:match.start()]+line+txt[match.end():]
              else: txt=txt.rstrip()+'\n'+line+'\n'
          ctrl.write_text(txt.rstrip()+'\n')
          run('dpkg-deb','-x','stable.deb','stable-check')
          original=Path('stable-check')
          permitted='var/jb/Library/PreferenceBundles/No2Theft.bundle/No2Theft3.plist'
          for p in original.rglob('*'):
              if not p.is_file():continue
              rel=p.relative_to(original)
              if rel.as_posix()==permitted: continue
              assert (root/rel).read_bytes()==p.read_bytes(),str(rel)
          for hook in ('N2TSMSLocationFix','N2TPhotoCrashGuard'):
              d=root/'var/jb/Library/MobileSubstrate/DynamicLibraries'
              assert (d/(hook+'.dylib')).is_file()
              assert (d/(hook+'.plist')).is_file()
          out='No2Theft-Enhanced-v1.3.5-Integrated-v3.8-Settings-Cleanup-TEST.deb'
          run('dpkg-deb','--root-owner-group','-Zgzip','-z9','--build',str(root),out)
          print('PASS: Original stable payload preserved except English Settings plist')
          print('PASS: Original settings rows unchanged except SMS section now precedes Email settings')
          print('PASS: Two hooks and only one Settings entry')
          PY
          shasum -a 256 No2Theft-Enhanced-v1.3.5-Integrated-v3.8-Settings-Cleanup-TEST.deb
      - name: Change only visible tweak names and re-sign preference bundle
        shell: bash
        run: |
          set -euo pipefail
          PREF="assembled/var/jb/Library/PreferenceBundles/No2Theft.bundle/No2Theft"
          python3 Branding/patch_branding.py "$PREF"
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root=Path("assembled")
          reg=root/"var/jb/Library/PreferenceLoader/Preferences/No2Theft3.plist"
          data=plistlib.loads(reg.read_bytes())
          assert data["entry"]["label"]=="No2Theft iOS 16"
          data["entry"]["label"]="No2Theft Enhanced iOS16"
          reg.write_bytes(plistlib.dumps(data,fmt=plistlib.FMT_XML,sort_keys=False))
          control=root/"DEBIAN/control"
          value=control.read_text()
          assert "Name: No2Theft Enhanced\n" in value
          assert "Version: 1.3.5+integrated3.8\n" in value
          value=value.replace("Name: No2Theft Enhanced\n","Name: No2Theft Enhanced iOS16\n")
          value=value.replace("Version: 1.3.5+integrated3.8\n","Version: 1.3.5+integrated3.9\n")
          control.write_text(value)
          print("PASS: Settings label and package metadata updated, keys untouched")
          PY
          if command -v ldid >/dev/null 2>&1; then
            ldid -S "$PREF"
          elif [[ -n "$THEOS" ]] && [[ -x "$THEOS/bin/ldid" ]]; then
            "$THEOS/bin/ldid" -S "$PREF"
          else
            echo "ldid not found, cannot safely install the patched preferences binary"
            exit 1
          fi
          dpkg-deb --root-owner-group -Zgzip -z9 --build assembled No2Theft-Enhanced-v1.3.5-Integrated-v3.9-Branding-TEST.deb
          python3 - <<'PY'
          import plistlib,subprocess,struct
          from pathlib import Path
          subprocess.run(["dpkg-deb","-x","No2Theft-Enhanced-v1.3.5-Integrated-v3.9-Branding-TEST.deb","brandcheck"],check=True)
          root=Path("brandcheck/var/jb/Library")
          entry=plistlib.loads((root/"PreferenceLoader/Preferences/No2Theft3.plist").read_bytes())
          assert entry["entry"]["label"]=="No2Theft Enhanced iOS16"
          b=(root/"PreferenceBundles/No2Theft.bundle/No2Theft").read_bytes()
          magic,count=struct.unpack_from(">II",b,0)
          assert magic==0xcafebabe and count==2
          for i in range(count):
              _,subtype,off,size,_=struct.unpack_from(">IIIII",b,8+i*20)
              width=43 if subtype==0x80000002 else 36
              for pos,target,expected in [(0x8268,0x8600,b"No2Theft Enhanced iOS16"),(0x8288,0x8620,b"By 551UK & Elias Sfeir")]:
                  pointer,length=struct.unpack_from("<QQ",b,off+pos+16)
                  assert pointer & ((1<<width)-1)==target
                  assert length==len(expected)
                  assert b[off+target:off+target+length]==expected
          old=Path("assembled/var/jb/Library/PreferenceBundles/No2Theft.bundle/No2Theft3.plist")
          new=root/"PreferenceBundles/No2Theft.bundle/No2Theft3.plist"
          assert old.read_bytes()==new.read_bytes()
          assert (root/"MobileSubstrate/DynamicLibraries/N2TSMSLocationFix.dylib").exists()
          assert (root/"MobileSubstrate/DynamicLibraries/N2TPhotoCrashGuard.dylib").exists()
          print("PASS: both architectures, unchanged original preference controls, GPS and Photo Guard present")
          PY
          shasum -a 256 No2Theft-Enhanced-v1.3.5-Integrated-v3.9-Branding-TEST.deb
      - name: Add red precise GPS location notice below 551UK header
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib,re,subprocess
          from pathlib import Path
          root=Path('assembled')
          preferences=root/'var/jb/Library/PreferenceBundles/No2Theft.bundle/No2Theft3.plist'
          obj=plistlib.loads(preferences.read_bytes())
          items=obj['items']
          assert items[0].get('headerCellClass')=='CLDHeaderCell'
          assert not any(x.get('headerCellClass')=='N2TGPSNoticeCell' for x in items)
          # Keep every original preference/section in order, including PIN/email.
          previous=list(items)
          items.insert(1,{'cell':'PSGroupCell','headerCellClass':'N2TGPSNoticeCell','height':66})
          assert items[0]==previous[0] and items[2:]==previous[1:]
          preferences.write_bytes(plistlib.dumps(obj,fmt=plistlib.FMT_XML,sort_keys=False))
          lib=root/'var/jb/Library/MobileSubstrate/DynamicLibraries'
          assert (lib/'N2TGPSNotice.dylib').is_file()
          filter_plist=plistlib.loads((lib/'N2TGPSNotice.plist').read_bytes())
          assert filter_plist['Filter']['Bundles']==['com.apple.Preferences']
          binary=(lib/'N2TGPSNotice.dylib').read_bytes()
          assert b'N2TGPSNoticeCell' in binary
          assert b'OPEN THE NO2THEFT LOCATION APP' in binary
          assert b'PRECISE LOCATION' in binary
          metadata=root/'DEBIAN/control'
          c=metadata.read_text()
          assert 'Version: 1.3.5+integrated3.9\n' in c
          c=c.replace('Version: 1.3.5+integrated3.9\n','Version: 1.3.5+integrated4.2\n')
          description=('Description: No2Theft Enhanced iOS16 - Theft Protection.\n'
                       ' - Restored SMS alerts and recipient settings for alarm and remote commands.\n'
                       ' - Real device GPS for email and SMS instead of IP-based location.\n'
                       ' - Repeating SOS flashlight to help locate a lost phone.\n'
                       ' - Remote phrases can activate enabled alarm, photo, SOS, email and SMS alerts.\n'
                       ' - Photo Crash Guard improves stability during alarm photos.')
          c,count=re.subn(r'^Description:.*(?:\n [^\n]*)*',lambda m:description,c,count=1,flags=re.M)
          assert count==1
          assert 'experimental' not in description.lower()
          metadata.write_text(c)
          out='No2Theft-Enhanced-iOS16-v4.2.deb'
          subprocess.run(['dpkg-deb','--root-owner-group','-Zgzip','-z9','--build',str(root),out],check=True)
          subprocess.run(['dpkg-deb','-x',out,'recheck4'],check=True)
          final=Path('recheck4/var/jb/Library')
          final_items=plistlib.loads((final/'PreferenceBundles/No2Theft.bundle/No2Theft3.plist').read_bytes())['items']
          assert final_items[1]['headerCellClass']=='N2TGPSNoticeCell'
          assert final_items[2:]==previous[1:]
          assert (final/'MobileSubstrate/DynamicLibraries/N2TSMSLocationFix.dylib').read_bytes()==(lib/'N2TSMSLocationFix.dylib').read_bytes()
          assert (final/'MobileSubstrate/DynamicLibraries/N2TPhotoCrashGuard.dylib').read_bytes()==(lib/'N2TPhotoCrashGuard.dylib').read_bytes()
          assert (final/'PreferenceBundles/No2Theft.bundle/No2Theft').read_bytes()==(root/'var/jb/Library/PreferenceBundles/No2Theft.bundle/No2Theft').read_bytes()
          print('PASS: red header class installed, old settings intact, GPS and photo guard unchanged')
          PY
          shasum -a 256 No2Theft-Enhanced-iOS16-v4.2.deb
      - uses: actions/upload-artifact@v4
        with:
          name: No2Theft-Enhanced-iOS16-v4.2-Build
          path: No2Theft-Enhanced-iOS16-v4.2.deb
          if-no-files-found: error
