name: Publish No2Theft Enhanced iOS16 v4.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v4.2.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download verified v4.2 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 38121240027 \
            --repo "$GITHUB_REPOSITORY" \
            --name No2Theft-Enhanced-iOS16-v4.2-Compact-Notice-TEST \
            --dir dist
          mv dist/No2Theft-Enhanced-v1.3.5-Integrated-v4.2-Compact-Notice-TEST.deb \
             dist/No2Theft-Enhanced-iOS16-v4.2.deb
          echo "0dadec23d6129b8520831f9ecc914cdffaeaa0cc2c87664ddb708c7f7655a408  dist/No2Theft-Enhanced-iOS16-v4.2.deb" | sha256sum --check
          test "$(dpkg-deb -f dist/No2Theft-Enhanced-iOS16-v4.2.deb Package)" = "xyz.cypwn.no2theft16"
          test "$(dpkg-deb -f dist/No2Theft-Enhanced-iOS16-v4.2.deb Version)" = "1.3.5+integrated4.2"
          test "$(dpkg-deb -f dist/No2Theft-Enhanced-iOS16-v4.2.deb Name)" = "No2Theft Enhanced iOS16"
          dpkg-deb -x dist/No2Theft-Enhanced-iOS16-v4.2.deb unpacked
          test -f unpacked/var/jb/Library/MobileSubstrate/DynamicLibraries/N2TSMSLocationFix.dylib
          test -f unpacked/var/jb/Library/MobileSubstrate/DynamicLibraries/N2TPhotoCrashGuard.dylib
          test -f unpacked/var/jb/Library/MobileSubstrate/DynamicLibraries/N2TGPSNotice.dylib
          echo "Verified clean v4.2 release asset"
      - name: Publish release with the clean filename
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v4.2 dist/No2Theft-Enhanced-iOS16-v4.2.deb \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v4.2 --title "No2Theft Enhanced iOS16 v4.2" \
              --notes-file RELEASE_NOTES_v4.2.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create v4.2 dist/No2Theft-Enhanced-iOS16-v4.2.deb \
              --title "No2Theft Enhanced iOS16 v4.2" \
              --notes-file RELEASE_NOTES_v4.2.md \
              --target "$GITHUB_SHA" --latest --repo "$GITHUB_REPOSITORY"
          fi
      - name: Verify published release before branch cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view v4.2 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[0].name')" = "No2Theft-Enhanced-iOS16-v4.2.deb"
          mkdir -p verify-release
          gh release download v4.2 -p 'No2Theft-Enhanced-iOS16-v4.2.deb' \
            --dir verify-release --repo "$GITHUB_REPOSITORY"
          echo "0dadec23d6129b8520831f9ecc914cdffaeaa0cc2c87664ddb708c7f7655a408  verify-release/No2Theft-Enhanced-iOS16-v4.2.deb" | sha256sum --check
      - name: Delete obsolete development branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[].name' | while IFS= read -r branch; do
              if [[ "$branch" != "main" ]]; then
                echo "Removing obsolete branch: $branch"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
              fi
            done
          echo "Remaining branches:"
          gh api "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name'
