name: Build independent No2Theft SMS Numbers Settings (test)
on:
  push:
    branches: [experimental-sms-location-ios16]
    paths:
      - 'SMSNumbersPrefs/**'
      - '.github/workflows/build-sms-numbers-separate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
      - name: Build separate rootless Settings bundle
        working-directory: SMSNumbersPrefs
        run: make clean package FINALPACKAGE=1
      - name: Verify independent settings-only package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tarfile,io
          files=list(Path('SMSNumbersPrefs/packages').glob('*.deb'))
          assert len(files)==1,files
          deb=files[0]
          raw=deb.read_bytes()
          assert raw.startswith(b'!<arch>\n')
          pos=8;members={}
          while pos<len(raw):
              head=raw[pos:pos+60]
              assert len(head)==60 and head[58:60]==bytes([96,10])
              key=head[:16].decode().strip().rstrip('/')
              size=int(head[48:58].decode().strip())
              pos+=60
              members[key]=raw[pos:pos+size]
              pos+=size+(size%2)
          archiveData=next(v for k,v in members.items() if k.startswith('data.tar'))
          with tarfile.open(fileobj=io.BytesIO(archiveData),mode='r:*') as archive:
              names=[m.name for m in archive.getmembers()]
          assert any(n.endswith('/Library/PreferenceBundles/N2TSMSNumbers.bundle/N2TSMSNumbers') for n in names),names
          assert any(n.endswith('/Library/PreferenceBundles/N2TSMSNumbers.bundle/SMSNumbers.plist') for n in names),names
          assert any(n.endswith('/Library/PreferenceBundles/N2TSMSNumbers.bundle/Info.plist') for n in names),names
          assert any(n.endswith('/Library/PreferenceLoader/Preferences/N2TSMSNumbers.plist') for n in names),names
          assert not any(n.endswith('/No2Theft3.plist') or n.endswith('/No2Theft.dylib') or n.endswith('/No2Theft.bundle/No2Theft') for n in names),names
          print('Standalone bundle verified; no original No2Theft files changed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: No2Theft-SMS-Numbers-Separate-Settings-v0.1.0-Test
          path: SMSNumbersPrefs/packages/*.deb
          if-no-files-found: error
