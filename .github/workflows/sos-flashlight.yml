name: Build No2Theft Enhanced SOS flashlight

on:
  push:
    branches: [no2theft-enhanced-sos]
    paths:
      - 'SOSFlashlight/**'
      - '.github/workflows/sos-flashlight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
      - name: Build arm64/arm64e rootless helper
        working-directory: SOSFlashlight
        run: make clean package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: No2Theft-Enhanced-SOS-arm64e
          path: SOSFlashlight/packages/*.deb
          if-no-files-found: error
