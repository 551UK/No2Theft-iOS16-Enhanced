name: Build No2Theft SMS Flow Fix (experimental)
on:
  push:
    branches: [experimental-sms-location-ios16]
    paths:
      - 'SMSFlowFix/**'
      - '.github/workflows/build-sms-flow-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
      - name: Compile arm64/arm64e rootless isolated SMS fix
        working-directory: SMSFlowFix
        run: make clean package FINALPACKAGE=1
      - name: Verify separate package
        run: |
          ls -lh SMSFlowFix/packages/*.deb
          python3 - <<'PY'
          import io,tarfile
          from pathlib import Path
          debs=list(Path('SMSFlowFix/packages').glob('*.deb'))
          assert len(debs)==1,debs
          raw=debs[0].read_bytes()
          assert raw.startswith(b'!<arch>\n')
          members={};p=8
          while p<len(raw):
              h=raw[p:p+60]
              assert len(h)==60 and h[58:60]==bytes([96,10])
              name=h[:16].decode().strip().rstrip('/')
              n=int(h[48:58].decode().strip())
              p+=60;members[name]=raw[p:p+n];p+=n+(n%2)
          with tarfile.open(fileobj=io.BytesIO(next(v for k,v in members.items() if k.startswith('data.tar'))),mode='r:*') as tf:
              names=[i.name for i in tf]
          assert any(x.endswith('/N2TSMSFlowFix.dylib') for x in names),names
          assert any(x.endswith('/N2TSMSFlowFix.plist') for x in names),names
          assert not any(x.endswith('/No2Theft.dylib') or x.endswith('/N2TSMSLocationFix.dylib') for x in names),names
          with tarfile.open(fileobj=io.BytesIO(next(v for k,v in members.items() if k.startswith('control.tar'))),mode='r:*') as tf:
              control=next(tf.extractfile(i).read().decode() for i in tf if i.name.lstrip('./')=='control')
          assert 'Package: uk.551.no2theft.smsflowfix' in control,control
          assert 'Version: 0.1.1' in control,control
          assert 'uk.551.no2theft.smslocationfix' not in next(x for x in control.splitlines() if x.startswith('Depends:')),control
          print('Standalone SMS-flow test package verified:',debs[0])
          PY
      - name: Upload standalone DEB
        uses: actions/upload-artifact@v4
        with:
          name: No2Theft-SMS-Flow-Fix-v0.1.1-Test
          path: SMSFlowFix/packages/*.deb
          if-no-files-found: error
