name: Build No2Theft Photo Crash Guard (experimental)
on:
  push:
    branches: [experimental-sms-location-ios16]
    paths:
      - 'PhotoCrashGuard/**'
      - '.github/workflows/build-photo-crash-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
      - name: Compile arm64 and arm64e rootless helper
        working-directory: PhotoCrashGuard
        run: make clean package FINALPACKAGE=1
      - name: Verify standalone package contents
        run: |
          ls -lh PhotoCrashGuard/packages/*.deb
          for f in PhotoCrashGuard/packages/*.deb; do
            test -s "$f"
            ar -t "$f" | grep -q 'control.tar'
            ar -t "$f" | grep -q 'data.tar'
            python3 - "$f" <<'PY'
          import io,tarfile,sys
          from pathlib import Path
          data=Path(sys.argv[1]).read_bytes()
          assert data.startswith(b'!<arch>\n')
          pos=8; members={}
          while pos<len(data):
              h=data[pos:pos+60]; assert len(h)==60 and h[58:60]==bytes([96,10])
              name=h[:16].decode().strip().rstrip('/')
              n=int(h[48:58].decode().strip());pos+=60
              members[name]=data[pos:pos+n];pos+=n+(n%2)
          with tarfile.open(fileobj=io.BytesIO(next(v for k,v in members.items() if k.startswith('data.tar'))),mode='r:*') as tf:
              names=[i.name for i in tf]
          assert any(x.endswith('/N2TPhotoCrashGuard.dylib') for x in names),names
          assert any(x.endswith('/N2TPhotoCrashGuard.plist') for x in names),names
          assert not any(x.endswith('/No2Theft.dylib') or x.endswith('/ZZNo2TheftOnDemandGPS.dylib') or x.endswith('/N2TSMSLocationFix.dylib') for x in names),names
          with tarfile.open(fileobj=io.BytesIO(next(v for k,v in members.items() if k.startswith('control.tar'))),mode='r:*') as tf:
              control=next(tf.extractfile(i).read().decode() for i in tf if i.name.lstrip('./')=='control')
          assert 'Package: uk.551.no2theft.photocrashguard' in control
          assert 'Version: 0.1.0' in control
          print('Standalone package verified:',names)
          PY
          done
      - name: Upload test package (not GitHub Releases)
        uses: actions/upload-artifact@v4
        with:
          name: No2Theft-Photo-Crash-Guard-v0.1.0-Experimental
          path: PhotoCrashGuard/packages/*.deb
          if-no-files-found: error
