name: Build experimental No2Theft SMS v1.3.5+sms1
on:
  push:
    branches: [experimental-sms-location-ios16]
    paths: ['.github/workflows/build-sms-experiment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify unchanged stable v1.3.5
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/551UK/No2Theft-iOS16-Enhanced/releases/download/v1.3.5/No2Theft-Enhanced-v1.3.5.deb" \
            --output stable.deb
          echo "e3d22e1dd8f407eb4c43a67f78b8956779c36f6f2e24d73e39d9e3609066a0ff  stable.deb" | sha256sum --check
      - name: Restore original SMS controls and repackage
        run: |
          dpkg-deb -R stable.deb package
          python3 - <<'PY'
          import plistlib,re
          from pathlib import Path
          p=Path('package/var/jb/Library/PreferenceBundles/No2Theft.bundle/No2Theft3.plist')
          data=plistlib.loads(p.read_bytes())
          items=data['items']
          assert any(x.get('key')=='emailRemote' for x in items)
          assert not any(x.get('key')=='sendSMS' for x in items)
          prefs={'defaults':'com.elias.no2theft3','PostNotification':'com.elias.no2theft3.preferences-changed','icon':'Enable.png'}
          fields=[
            {'cell':'PSGroupCell','label':'SMS Location Alerts','footerText':'Experimental iOS 16 test of the original SMS sender. Sends only to numbers entered below when the original alarm SMS event fires. Carrier charges may apply.'},
            {'cell':'PSSwitchCell','label':'Send SMS Location','key':'sendSMS','default':False,**prefs},
            {'cell':'PSEditTextCell','label':'Phone 1:','key':'firstNumber','defaults':'com.elias.no2theft3','detail':'PSDetailController','placeholder':'Mobile number','icon':'Wifsi.png','isNumeric':True},
            {'cell':'PSEditTextCell','label':'Phone 2:','key':'secondNumber','defaults':'com.elias.no2theft3','detail':'PSDetailController','placeholder':'Mobile number','icon':'Wifsi.png','isNumeric':True},
          ]
          index=next(i for i,x in enumerate(items) if x.get('label')=='Remote Commands')
          items[index:index]=fields
          index=next(i for i,x in enumerate(items) if x.get('key')=='emailRemote')
          items.insert(index,{'cell':'PSSwitchCell','label':'SMS Remote (Original)','key':'smsRemote','default':False,**prefs})
          p.write_bytes(plistlib.dumps(data,fmt=plistlib.FMT_XML,sort_keys=False))
          f=Path('package/DEBIAN/control')
          c=f.read_text()
          c,n=re.subn(r'^Version:.*$','Version: 1.3.5+sms1',c,count=1,flags=re.M)
          assert n==1
          descr=('Description: No2Theft Enhanced iOS 16 - experimental original SMS support.\n'
                 ' .\n'
                 ' Changes from stable v1.3.5:\n'
                 '  - Restores the original Send SMS Location switch.\n'
                 '  - Adds two configurable SMS recipient phone numbers.\n'
                 '  - Restores the original SMS Remote switch.\n'
                 '  - Keeps existing alarm, email, GPS and SOS binaries unchanged.\n'
                 ' .\n'
                 ' SMS delivery and SMS map accuracy are unverified on iOS 16.\n')
          c,n=re.subn(r'^Description:.*\n(?: [^\n]*\n)*',descr,c,count=1,flags=re.M)
          assert n==1
          f.write_text(c)
          PY
          chmod 0755 package/DEBIAN
          chmod g-s package/DEBIAN
          dpkg-deb --root-owner-group -Zgzip -z9 --build package No2Theft-Enhanced-v1.3.5-SMS-Experimental.deb
          test "$(dpkg-deb -f No2Theft-Enhanced-v1.3.5-SMS-Experimental.deb Version)" = "1.3.5+sms1"
          dpkg-deb -x stable.deb original-files
          diff -qr original-files package --exclude=DEBIAN | grep '^Files' | grep 'No2Theft3.plist'
          test "$(diff -qr original-files package --exclude=DEBIAN | wc -l)" -eq 1
          sha256sum No2Theft-Enhanced-v1.3.5-SMS-Experimental.deb
      - name: Upload separate experimental DEB
        uses: actions/upload-artifact@v4
        with:
          name: No2Theft-Enhanced-v1.3.5-SMS-Experimental
          path: No2Theft-Enhanced-v1.3.5-SMS-Experimental.deb
          if-no-files-found: error
